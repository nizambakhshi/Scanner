; Scanner edge listener — the only Postgres door that can be reached from outside
; the house. Source of truth lives here; `install_edge.sh` copies it to
; /opt/homebrew/etc/pgbouncer.ini, which is where the brew launchd job reads it.
;
; Why a pooler instead of forwarding Supabase's own port:
;  * The `postgres` role has Supabase's short generated password and Studio,
;    PostgREST and local development all depend on it. It must never be usable from
;    a public address. This gate accepts exactly one user — the userlist holds only
;    scanner_edge — and rewrites every server connection to that user.
;  * 23 of the public tables have row-level security enabled. scanner_edge carries
;    BYPASSRLS deliberately: this is a single-operator tool with no per-user
;    policies, and without it those reads return zero rows and look like an empty
;    database rather than a permissions problem.
;  * Vercel thaws frozen serverless instances onto sockets the network has already
;    forgotten. A bounded pool in front of the Mini turns that into a queue instead
;    of a refusal, which is the same failure that the Supabase session pooler
;    (EMAXCONNSESSION) used to cause.
;  * TLS terminates here. The hop from pgbouncer to the Supabase container is
;    loopback, so the database itself stays unconfigured-and-fine.
;
; The public port is NOT set here: the router forwards e.g. 25432 -> this box:6543,
; so `listen_port` only ever needs to be reachable on the LAN.

[databases]
postgres = host=127.0.0.1 port=54322 dbname=postgres user=scanner_edge

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6543
unix_socket_dir = /tmp

auth_type = scram-sha-256
auth_file = /opt/homebrew/etc/pgbouncer/userlist.txt

; Session pooling, not transaction: app/lib/db.ts keeps prepared statements enabled
; for any URL that is not Supabase's own :6543 transaction pooler (it matches on
; `pooler.supabase.com` + `:6543`, which this is not), and transaction mode would
; break the first named prepared statement it reuses across a different client.
pool_mode = session
max_client_conn = 200
default_pool_size = 20
min_pool_size = 0
server_login_retry = 5
client_login_timeout = 15
query_wait_timeout = 120
query_timeout = 60
server_reset_query = DISCARD ALL
server_idle_timeout = 30
server_lifetime = 3600

; Serverless sockets die silently; keepalive makes the driver notice within ~2min
; instead of hanging until the read deadline in app/lib/db.ts.
tcp_keepalive = 1
tcp_keepcnt = 5
tcp_keepidle = 30
tcp_keepintvl = 15

client_tls_sslmode = require
client_tls_key_file = /opt/homebrew/etc/pgbouncer/keys/server.key
client_tls_cert_file = /opt/homebrew/etc/pgbouncer/keys/server.crt
; `secure` = TLS 1.2 and up. pgbouncer rejects the literal `TLSv1.2+TLSv1.3`.
client_tls_protocols = secure
server_tls_sslmode = disable

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
verbose = 0
